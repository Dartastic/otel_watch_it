name: otel_watch_it
description: >-
  OpenTelemetry instrumentation for package:watch_it. Wraps GetIt scope
  push/drop transitions and callOnce blocks in CLIENT-kind spans to expose
  DI scope churn.
version: 0.2.0-wip
repository: https://github.com/dartastic/otel_watch_it
homepage: https://dartastic.io

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  dartastic_opentelemetry: ^1.1.0-beta.12
  dartastic_opentelemetry_api: ^1.0.0-rc.1
  flutter:
    sdk: flutter
  get_it: ^9.2.0
  watch_it: ^2.4.0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2
  flutter_test:
    sdk: flutter
  pub_semver: ^2.0.0
  pubspec_parse: ^1.5.0
